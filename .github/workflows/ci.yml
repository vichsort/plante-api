name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --all-extras --locked

      - name: Ruff
        run: uv run ruff check src tests migrations

      - name: Mypy
        run: uv run mypy

      - name: Camadas (import-linter)
        run: uv run lint-imports

      # Testes de contrato (`-m contract`) ficam de fora: chamam as APIs reais e gastam créditos
      - name: Pytest
        run: uv run pytest -q
