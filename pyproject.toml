[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plante-api"
version = "0.1.3"
description = "PlantE - Sistema de identificação e gestão botânica"
requires-python = ">=3.12"

dependencies = [
    # --- Web ---
    "fastapi==0.115.14",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.29",
    # --- Banco de dados ---
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.4",
    # --- Cache / Broker ---
    "redis==5.0.8",
    # --- Workers ---
    "celery==5.4.0",
    "celery-pool-asyncio==0.2.0",
    # --- Config / Validação ---
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "typing-extensions==4.15.0",
    "python-dotenv==1.2.2",
    # --- Auth ---
    "bcrypt==5.0.0",
    "PyJWT==2.12.1",
    "email-validator==2.3.0",
    # --- AWS (S3 + SES) ---
    "aioboto3==15.5.0",
    "boto3==1.40.61",
    # --- IA ---
    "google-genai==2.4.0",
    "httpx==0.28.1",
    # --- Storage async ---
    "aiofiles==25.1.0",
    # --- Imagens (remoção de EXIF antes de qualquer uso) ---
    "pillow==12.3.0",
    # --- Fusos (zoneinfo): imagem slim pode não ter o banco de fusos do sistema ---
    "tzdata==2026.2",
    # --- Logs ---
    "structlog==24.4.0",
    # --- Resiliência ---
    "tenacity==9.1.4",
    # --- Injeção de dependência ---
    "dependency-injector==4.49.0",
    "greenlet>=3.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",  # TestClient do FastAPI
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Loop novo por teste: fixtures assíncronas (sessão do banco, cliente Redis) não atravessam testes
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Contrato chama as APIs reais (gasta créditos): só com `pytest -m contract`
addopts = "-m 'not contract'"
markers = ["contract: chama as APIs reais dos provedores de IA"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
# `Any` é proibido: nem escrito, nem vindo de decorators ou de expressões de bibliotecas
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Cola de biblioteca: módulos cujo papel é falar com uma biblioteca que tipa a própria API com
# `Any` (decorators do FastAPI/dependency_injector/Celery são `Callable[..., Any]`; o typeshed tipa
# toda corrotina como `Coroutine[Any, Any, T]`). Neles, `Any` escrito continua proibido; só a
# checagem de expressões/decorators é desligada, e o dado que sai daqui para o domínio já sai
# tipado. Lista fechada: entrar nela exige justificativa.
[[tool.mypy.overrides]]
module = [
    # Clientes de bibliotecas, isolados num módulo cada
    "src.adapters.cache.redis_client",  # redis-py: todo comando devolve Any
    "src.adapters.ai.gemini.client",  # google-genai: config e erros tipados com Any
    "src.adapters.security.jwt_token_service",  # PyJWT: payload é dict[str, Any] (validado por Pydantic logo depois)
    "src.adapters.persistence.*",  # SQLAlchemy ORM: modelos e consultas carregam genéricos com Any
    # Celery: tasks e sinais
    "src.adapters.events.celery_publisher",
    "src.infrastructure.celery_config",
    "src.workers.*",
    # FastAPI / dependency_injector: decorators de rota e @inject, scope ASGI, erros de validação
    "src.api.routers.*",
    "src.api.deps",
    "src.api.exception_handlers",
    "src.api.middleware.audit",
    "src.main",
    # Composição: containers do dependency_injector e pydantic-settings
    "src.infrastructure.container",
    "src.infrastructure.containers.*",
    "src.infrastructure.settings",
]
disallow_any_expr = false
disallow_any_decorated = false

# Subclasse de BaseSettings: o mypy sintetiza o __init__ a partir do `**values: Any` do
# pydantic-settings. Nenhum Any é escrito no módulo; é a única exceção a `disallow_any_explicit`.
[[tool.mypy.overrides]]
module = ["src.infrastructure.settings"]
disallow_any_explicit = false

# ---------------------------------------------------------------------------
# Import Linter — camadas da arquitetura hexagonal (ARCHITECTURE.md, seção 1)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "src"
include_external_packages = true

# Uma camada só importa as de baixo. `src.main` e `src.infrastructure` são a composição (montam
# o container); API e workers são as entradas e não se conhecem.
[[tool.importlinter.contracts]]
name = "Camadas: entradas -> composição -> adapters -> domínio"
type = "layers"
containers = ["src"]
layers = [
    "main",
    "api | workers",
    "infrastructure",
    "adapters",
    "domain",
]
exhaustive = true  # pacote novo em `src` precisa entrar numa camada

# As entradas recebem adapters pelo container, nunca importando-os direto.
[[tool.importlinter.contracts]]
name = "Entradas não importam adapters"
type = "forbidden"
source_modules = ["src.api", "src.workers"]
forbidden_modules = ["src.adapters"]
allow_indirect_imports = true  # via src.infrastructure (o container) é o caminho esperado
ignore_imports = [
    # Exceção: o readiness pinga o Redis e só o RedisClient conhece o redis-py. Uma porta no
    # domínio para isso seria só cerimônia (o probe é infraestrutura, não regra de negócio).
    "src.api.routers.probes -> src.adapters.cache.redis_client",
]

# Domínio puro: só biblioteca padrão, `typing_extensions` e `structlog` (logs).
[[tool.importlinter.contracts]]
name = "Domínio não importa frameworks"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = [
    "aioboto3",
    "aiofiles",
    "alembic",
    "bcrypt",
    "boto3",
    "celery",
    "dependency_injector",
    "dotenv",
    "email_validator",
    "fastapi",
    "google",
    "httpx",
    "jwt",
    "multipart",
    "psycopg",
    "pydantic",
    "pydantic_settings",
    "redis",
    "sqlalchemy",
    "starlette",
    "tenacity",
    "uvicorn",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter — substitui flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN401"]  # pycodestyle, pyflakes, isort, pyupgrade, Any em anotação
ignore = ["E501", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[dependency-groups]
dev = [
    "boto3-stubs[ses]>=1.43.114",
    "celery-types>=0.26.0",
    "import-linter>=2.15",
    "mypy>=2.3.0",
    "ruff>=0.6.0",
    "testcontainers[postgres]>=4.15.0",
    "types-aioboto3[s3]>=15.5.0",
]
