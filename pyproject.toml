[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plante-api"
version = "0.1.2"
description = "PlantE - Sistema de identificação e gestão botânica"
requires-python = ">=3.12"

dependencies = [
    # --- Web ---
    "fastapi==0.115.14",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.29",
    # --- Banco de dados ---
    "sqlalchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg[binary]==3.2.4",
    # --- Cache / Broker ---
    "redis==5.0.8",
    # --- Workers ---
    "celery==5.4.0",
    "celery-pool-asyncio==0.2.0",
    # --- Config / Validação ---
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "typing-extensions==4.15.0",
    "python-dotenv==1.2.2",
    # --- Auth ---
    "bcrypt==5.0.0",
    "PyJWT==2.12.1",
    "email-validator==2.3.0",
    # --- AWS (S3 + SES) ---
    "aioboto3==15.5.0",
    "boto3==1.40.61",
    # --- IA ---
    "google-genai==2.4.0",
    "httpx==0.28.1",
    # --- Storage async ---
    "aiofiles==25.1.0",
    # --- Imagens (remoção de EXIF antes de qualquer uso) ---
    "pillow==12.3.0",
    # --- Fusos (zoneinfo): imagem slim pode não ter o banco de fusos do sistema ---
    "tzdata==2026.2",
    # --- Logs ---
    "structlog==24.4.0",
    # --- Resiliência ---
    "tenacity==9.1.4",
    # --- Injeção de dependência ---
    "dependency-injector==4.49.0",
    "greenlet>=3.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",  # TestClient do FastAPI
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Loop novo por teste: fixtures assíncronas (sessão do banco, cliente Redis) não atravessam testes
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "src"]  # testes dos módulos ficam em `src/**/tests/`
# Contrato chama as APIs reais (gasta créditos): só com `pytest -m contract`
addopts = "-m 'not contract'"
markers = ["contract: chama as APIs reais dos provedores de IA"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
exclude = ["^src/.*/tests/"]  # testes não passam pelo mypy estrito (o ruff cobre)
plugins = ["pydantic.mypy"]
# `Any` é proibido: nem escrito, nem vindo de decorators ou de expressões de bibliotecas
disallow_any_explicit = true
disallow_any_decorated = true
disallow_any_expr = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Cola de biblioteca: módulos cujo papel é falar com uma biblioteca que tipa a própria API com
# `Any` (decorators do FastAPI/dependency_injector/Celery são `Callable[..., Any]`; o typeshed tipa
# toda corrotina como `Coroutine[Any, Any, T]`). Neles, `Any` escrito continua proibido; só a
# checagem de expressões/decorators é desligada, e o dado que sai daqui para o domínio já sai
# tipado. Lista fechada: entrar nela exige justificativa.
[[tool.mypy.overrides]]
module = [
    # Clientes de bibliotecas, isolados num módulo cada
    "src.shared.adapters.redis.client",  # redis-py: todo comando devolve Any
    "src.shared.adapters.providers.gemini_client",  # google-genai: config e erros tipados com Any
    "src.modules.identity.adapters.security.jwt_token_service",  # PyJWT: payload é dict[str, Any] (validado por Pydantic logo depois)
    "src.shared.adapters.persistence.*",  # SQLAlchemy ORM: modelos e consultas carregam genéricos com Any
    "src.modules.*.adapters.persistence.*",
    # Celery: tasks e sinais
    "src.bootstrap.celery_config",
    "src.workers.*",
    "src.modules.*.workers.tasks",
    "src.bootstrap.worker",  # sinais do Celery
    # FastAPI / dependency_injector: decorators de rota e @inject, scope ASGI, erros de validação
    "src.modules.*.api.router",
    "src.shared.api.exception_handlers",
    "src.shared.api.authentication",  # `app.state` do Starlette é Any (o verificador sai conferido por isinstance)
    "src.shared.api.middleware.audit",
    "src.bootstrap.probes",
    "src.main",
    # Composição: containers do dependency_injector e pydantic-settings
    "src.bootstrap.container",
    "src.bootstrap.wiring",
    "src.bootstrap.containers.*",
    "src.bootstrap.connections",  # fecha o que os providers devolvem (Any)
    "src.bootstrap.settings",
    "src.bootstrap.models",  # metadata do SQLAlchemy
]
disallow_any_expr = false
disallow_any_decorated = false

# Subclasse de BaseSettings: o mypy sintetiza o __init__ a partir do `**values: Any` do
# pydantic-settings. Nenhum Any é escrito no módulo; é a única exceção a `disallow_any_explicit`.
[[tool.mypy.overrides]]
module = ["src.bootstrap.settings"]
disallow_any_explicit = false

# ---------------------------------------------------------------------------
# Import Linter — camadas e fronteiras dos módulos (ARCHITECTURE.md, seção 3)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "src"
include_external_packages = true

# Uma camada só importa as de baixo. `src.main` e `src.bootstrap` são a composição (montam
# containers e o app); `src.workers` é a entrada do Celery (`celery -A src.workers`). Módulos e
# kernel nunca importam a composição.
[[tool.importlinter.contracts]]
name = "Camadas: entradas -> composição -> módulos -> shared"
type = "layers"
containers = ["src"]
layers = [
    "main",
    "workers",
    "bootstrap",
    "modules",
    "shared",
]
exhaustive = true  # pacote novo em `src` precisa entrar numa camada

# As entradas recebem adapters pelo container, nunca importando-os direto (as rotas e tasks dos
# módulos seguem as camadas de cada módulo, abaixo).
[[tool.importlinter.contracts]]
name = "Entradas não importam adapters"
type = "forbidden"
source_modules = ["src.workers"]
forbidden_modules = ["src.shared.adapters"]
allow_indirect_imports = true  # via src.bootstrap (o container) é o caminho esperado

# Domínio puro (kernel e de cada módulo): só biblioteca padrão, `typing_extensions` e `structlog`
# (logs).
[[tool.importlinter.contracts]]
name = "Domínio não importa frameworks"
type = "forbidden"
source_modules = ["src.shared.domain", "src.modules.*.domain"]
forbidden_modules = [
    "aioboto3",
    "aiofiles",
    "alembic",
    "bcrypt",
    "boto3",
    "celery",
    "dependency_injector",
    "dotenv",
    "email_validator",
    "fastapi",
    "google",
    "httpx",
    "jwt",
    "multipart",
    "psycopg",
    "pydantic",
    "pydantic_settings",
    "redis",
    "sqlalchemy",
    "starlette",
    "tenacity",
    "uvicorn",
]

# Dentro do kernel: o domínio não conhece adapters nem a borda HTTP.
[[tool.importlinter.contracts]]
name = "Camadas do shared"
type = "layers"
containers = ["src.shared"]
layers = [
    "(tests)",
    "api | workers",
    "adapters",
    "domain",
]
exhaustive = true

# Dentro de cada módulo (hexagonal): o domínio não conhece adapters, container nem entradas. As
# camadas entre parênteses são opcionais (um módulo sem rota não tem `api`). Testes ficam no topo:
# podem usar tudo do próprio módulo, e nada de dentro os importa.
[[tool.importlinter.contracts]]
name = "Camadas de cada módulo"
type = "layers"
containers = ["src.modules.*"]
layers = [
    "(tests)",
    "(api) | (workers)",
    "(container)",
    "(adapters)",
    "domain",
]
exhaustive = true

# Entre módulos (ARCHITECTURE.md 3.7): uma camada só importa as de baixo; `|` separa módulos
# independentes (não se importam).
[[tool.importlinter.contracts]]
name = "Dependências entre módulos"
type = "layers"
containers = ["src.modules"]
layers = [
    "health | achievements",
    "garden",
    "identification",
    "identity | subscription | catalog | training",
]
exhaustive = true

# ---------------------------------------------------------------------------
# Ruff (linter + formatter — substitui flake8/black/isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN401"]  # pycodestyle, pyflakes, isort, pyupgrade, Any em anotação
ignore = ["E501", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[dependency-groups]
dev = [
    "boto3-stubs[ses]>=1.43.114",
    "celery-types>=0.26.0",
    "import-linter>=2.15",
    "mypy>=2.3.0",
    "ruff>=0.6.0",
    "testcontainers[postgres]>=4.15.0",
    "types-aioboto3[s3]>=15.5.0",
]
